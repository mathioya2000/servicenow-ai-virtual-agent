<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ServiceNow AI Virtual Agent</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #eef3f8;
            margin: 0;
            padding: 40px;
        }

        .container {
            max-width: 950px;
            margin: auto;
            background: white;
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.10);
        }

        h1 {
            color: #0b5cab;
            margin-bottom: 5px;
        }

        .subtitle {
            color: #555;
            margin-bottom: 25px;
        }

        textarea {
            width: 100%;
            height: 130px;
            padding: 14px;
            font-size: 16px;
            border-radius: 10px;
            border: 1px solid #cbd5e1;
        }

        button {
            margin-top: 18px;
            background: #0b5cab;
            color: white;
            border: none;
            padding: 13px 26px;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #08457f;
        }

        .card {
            margin-top: 25px;
            background: #f8fafc;
            border-left: 5px solid #0b5cab;
            padding: 20px;
            border-radius: 12px;
        }

        .label {
            font-weight: bold;
            color: #0b5cab;
        }

        pre {
            white-space: pre-wrap;
            font-family: Arial, sans-serif;
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>ServiceNow AI Virtual Agent</h1>
        <p class="subtitle">AI-powered employee support using ServiceNow Knowledge Base</p>

        <textarea id="messageInput" placeholder="Example: My VPN is not connecting"></textarea>

        <button onclick="sendMessage()">Ask Virtual Agent</button>

        <div class="card">
            <p><span class="label">Knowledge Articles Found:</span> <span id="articleCount">Waiting for question...</span></p>
        </div>

        <div class="card">
            <p class="label">AI Support Response</p>
            <pre id="responseBox">Response will appear here...</pre>
        </div>
    </div>

    <script>
        async function sendMessage() {
            const message = document.getElementById("messageInput").value;

            document.getElementById("articleCount").innerText = "Searching...";
            document.getElementById("responseBox").innerText =
                "Searching ServiceNow Knowledge Base and generating response...";

            const response = await fetch("/chat", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({user_message: message})
            });

            const data = await response.json();

            if (data.status === "success") {
                document.getElementById("articleCount").innerText = data.kb_articles_found;
                document.getElementById("responseBox").innerText = data.ai_response;
            } else {
                document.getElementById("articleCount").innerText = "Error";
                document.getElementById("responseBox").innerText = data.error_message;
            }
        }
    </script>
</body>
</html>
